services:
  - type: web
    name: harikashi
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: harikashi-db
          property: connectionString
      - key: HARIKASHI_SECRET_KEY
        generateValue: true

databases:
  - name: harikashi-db
    plan: free
